[project]
name = "healthmesh-backend"
version = "0.1.0"
description = "Synthetic HealthMesh administrative supply simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.7",
  "djangorestframework==3.16.1",
  "dj-database-url==3.0.1",
  "psycopg[binary]==3.2.10",
  "pydantic==2.12.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-django==4.11.1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["healthmesh/tests"]
